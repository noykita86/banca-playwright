name: Playwright Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      # 1) Descarga el codigo del repo.
      - name: Checkout del codigo
        uses: actions/checkout@v4

      # 2) Instala Node.js.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3) Instala dependencias con instalacion limpia.
      - name: Instalar dependencias
        run: npm ci

      # 4) Instala navegadores de Playwright.
      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium

      # 5) Smoke tests primero (fail fast).
      #    Si estos fallan, el pipeline se corta sin ejecutar los 42.
      - name: Smoke tests (fail fast)
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      #   Credenciales de Xray para el paso de Smoke
          XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
          XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
          XRAY_PROJECT_KEY: ${{ secrets.XRAY_PROJECT_KEY }}

        run: npx playwright test --grep "@smoke"

      # 6) Suite completa (solo si los smoke pasaron).
      - name: Suite completa
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      #   Credenciales de Xray para la Suite completa
          XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
          XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
          XRAY_PROJECT_KEY: ${{ secrets.XRAY_PROJECT_KEY }}

        run: npx playwright test

      # 7) Sube el reporte HTML como artefacto descargable (siempre).
      - name: Subir reporte HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30